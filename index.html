<!doctype html>
<html lang="de-CH" data-mode="dunkelblau" data-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Content-Security-Policy: nur eigene Dateien, Firebase-SDK (gstatic),
      Google-APIs (Firestore, Anmeldung; www.google.com: Netz-Test von Firestore),
      Leaflet (cdn.jsdelivr.net), Kartenkacheln (Hosts wie js/ui/map/layers.js)
      und OpenStreetMap-Abfragen (Overpass). Neue externe Quellen hier ergänzen.
      Kein Tracking!
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://*.googleapis.com https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee; img-src 'self' data: blob: https://www.google.com https://*.openstreetmap.org https://*.openstreetmap.de https://*.openstreetmap.fr https://*.opentopomap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://tile.waymarkedtrails.org https://wmts.geo.admin.ch; style-src 'self' https://cdn.jsdelivr.net; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'"
    />
    <title>Bikepacking</title>
    <meta name="description" content="Begleit-App für lange Bikepacking-Touren" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- iOS Home-Screen-App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Statusleiste deckend ("default"), Farbe = theme-color (Hintergrund des
      Farbmodus, gesetzt von js/boot.js und js/ui/display.js). NICHT
      "black-translucent": Ab iOS 26 legt iOS sonst eine Unschärfe über den
      oberen Rand der App. iOS liest diesen Wert nur beim Hinzufügen zum
      Home-Bildschirm.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bikepacking" />
    <meta name="theme-color" content="#0b1324" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Frühstart: Darstellung setzen, frühe Fehler sammeln, Notfall-Anzeige -->
    <script src="js/boot.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="sim-bar" id="sim-bar" role="status">
      <span>SIM-MODUS</span>
      <span id="sim-bar-time"></span>
    </div>

    <!-- Kopfbereich: deckend in der Hintergrundfarbe (keine Leiste, keine Unschärfe) -->
    <div class="top-cover" aria-hidden="true"></div>

    <header class="app-header" id="app-header">
      <button class="header-back" id="header-back" type="button" hidden></button>
      <h1 class="header-title" id="header-title">Bikepacking</h1>
      <button class="header-status" id="header-status" type="button" aria-label="Verbindung – Details im Debug-Bereich"></button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <div class="banner-area" id="banner-area" aria-live="polite"></div>

    <nav class="tabbar glass" id="tabbar" aria-label="Hauptnavigation">
      <a class="tab" href="#status" data-tab="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
        <span>Status</span>
      </a>
      <a class="tab" href="#karte" data-tab="karte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" /><path d="M9 4v14M15 6v14" /></svg>
        <span>Karte</span>
      </a>
      <a class="tab" href="#plan" data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M3 10h18M8 3v4M16 3v4M7.5 14.5h3M7.5 17.5h6" /></svg>
        <span>Plan</span>
      </a>
      <a class="tab" href="#statistik" data-tab="statistik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2" /></svg>
        <span>Statistik</span>
      </a>
      <a class="tab" href="#mehr" data-tab="mehr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" /><circle cx="12" cy="12" r="1.6" fill="currentColor" /><circle cx="19" cy="12" r="1.6" fill="currentColor" /></svg>
        <span>Mehr</span>
      </a>
    </nav>

    <div id="login" hidden></div>
    <div class="boot-fallback" id="boot-fallback" hidden></div>
    <noscript><p class="footnote">Diese App braucht JavaScript.</p></noscript>
  </body>
</html>
